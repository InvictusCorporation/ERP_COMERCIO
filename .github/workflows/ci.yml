name: Verificações da fundação
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: invictus_bootstrap
          POSTGRES_PASSWORD: ci-temporary-database-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U invictus_bootstrap -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - name: Configurar exclusivamente o banco descartável do runner
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          if (process.env.GITHUB_ACTIONS !== 'true') throw new Error('Somente runner de CI.');
          writeFileSync('.env', [
            'NODE_ENV=development', 'API_HOST=127.0.0.1', 'API_PORT=3333',
            'WEB_PORT=3000', 'API_INTERNAL_URL=http://127.0.0.1:3333',
            'POSTGRES_PORT=55432', 'POSTGRES_DB=invictus_dev',
            'POSTGRES_USER=invictus_bootstrap', 'POSTGRES_PASSWORD=ci-temporary-database-only'
          ].join('\n')+'\n', { flag: 'wx', mode: 0o600 });
          NODE
          npm run db:migrate
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run typecheck
